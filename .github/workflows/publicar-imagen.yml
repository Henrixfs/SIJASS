# Publicación MANUAL de la imagen en GHCR (s1e, design.md D6). No se ejecuta sola: solo con
# "Run workflow". Publicar es una acción hacia afuera; el despliegue a un servidor NO está
# automatizado porque requiere un destino y credenciales que aún no existen.
name: Publicar imagen

on:
  workflow_dispatch:
    inputs:
      etiqueta:
        description: Etiqueta de la imagen (por ejemplo, 0.1.0)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Iniciar sesión en GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Construir y publicar
        run: |
          IMAGEN="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sijass:${{ inputs.etiqueta }}"
          docker build -t "$IMAGEN" .
          docker push "$IMAGEN"
