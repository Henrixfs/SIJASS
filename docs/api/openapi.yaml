openapi: 3.1.0
info:
  title: API de SIJASS
  version: 0.1.0-prototipo
  description: |
    Contrato HTTP del prototipo de SIJASS (ADR-011). **Estado: prototipo**; no es una API publicada.

    - Todas las rutas van bajo `/v1`. Los importes viajan como **céntimos enteros**.
    - La JASS, el perfil y el rol **nunca** se envían: salen de la membresía activa de la cuenta autenticada.
    - Se entra con el **DNI** (8 dígitos) y una clave; el correo no se usa. El `tipo` de acceso (`asociado` o
      `administrador`) es solo una guía: el servidor decide el perfil por la membresía.
    - Las claves temporales (tres palabras) se devuelven **una sola vez**, en la respuesta que las genera.
    - Una cuenta con el cambio de clave pendiente solo puede cambiarla, consultar `yo` o cerrar sesión (`403 cambio-de-clave-pendiente`).
    - Un recurso inexistente y uno de otra JASS devuelven el mismo `403` sin datos.
    - `Idempotency-Key` (UUID) es obligatorio en `POST /pagos` y `POST /mediciones`.
    - La API publica este mismo documento como **Swagger UI** en `/docs` (autoalojado) y como colección de Postman
      generada desde él (`docs/api/sijass.postman_collection.json`).
    - Una prueba automática (`contrato-openapi.test.ts`) verifica que este documento y los controladores
      declaran las mismas rutas y que los estados observados están declarados.
servers:
  - url: http://localhost:3000
    description: Desarrollo local
security:
  - bearer: []
tags:
  - name: Sistema
  - name: Acceso
  - name: Equipo de la JASS
  - name: Plataforma
  - name: Padrón y pagos
  - name: Portal del asociado
  - name: Reservorios y mediciones
  - name: Asistente

paths:
  /v1/salud:
    get:
      tags: [Sistema]
      operationId: consultarSalud
      summary: Sonda de salud (pública)
      security: []
      responses:
        '200': { description: Proceso y base de datos disponibles, content: { application/json: { schema: { $ref: '#/components/schemas/Salud' } } } }
        '503': { description: La base de datos no responde, content: { application/json: { schema: { $ref: '#/components/schemas/Salud' } } } }

  /v1/auth/login:
    post:
      tags: [Acceso]
      operationId: iniciarSesion
      summary: Inicio de sesión con DNI y clave
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credenciales' } } } }
      responses:
        '200': { description: Sesión iniciada, content: { application/json: { schema: { $ref: '#/components/schemas/Sesion' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '403': { description: Sin membresía activa o JASS suspendida (`jass-suspendida`), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Credenciales correctas pero el tipo de acceso elegido no es el de la cuenta (`tipo-de-acceso-distinto`, con `tipoReal`); no se emite sesión, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorTipoDeAcceso' } } } }
        '422': { $ref: '#/components/responses/E422' }
        '429': { $ref: '#/components/responses/E429' }
  /v1/auth/refresh:
    post:
      tags: [Acceso]
      operationId: renovarSesion
      summary: Renueva la sesión; el token de refresco rota
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Refresco' } } } }
      responses:
        '200': { description: Nueva sesión, content: { application/json: { schema: { $ref: '#/components/schemas/Sesion' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
  /v1/auth/logout:
    post:
      tags: [Acceso]
      operationId: cerrarSesion
      summary: Cierra la sesión (idempotente)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Refresco' } } } }
      responses:
        '204': { description: Sesión cerrada }
        '400': { $ref: '#/components/responses/E400' }
  /v1/auth/cambiar-contrasena:
    post:
      tags: [Acceso]
      operationId: cambiarContrasena
      summary: Cambia la propia clave, cierra las sesiones anteriores y devuelve una sesión nueva
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CambioDeClave' } } } }
      responses:
        '200': { description: Clave cambiada; sesión nueva, content: { application/json: { schema: { $ref: '#/components/schemas/Sesion' } } } }
        '400': { $ref: '#/components/responses/E400' }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '422': { $ref: '#/components/responses/E422' }
        '429': { $ref: '#/components/responses/E429' }
  /v1/yo:
    get:
      tags: [Acceso]
      operationId: consultarPerfil
      summary: Perfil, rol, nombre, DNI enmascarado y nombre de la JASS de quien consulta (sin identificadores internos)
      responses:
        '200': { description: Perfil, content: { application/json: { schema: { $ref: '#/components/schemas/Perfil' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }

  /v1/asociados:
    get:
      tags: [Padrón y pagos]
      operationId: listarAsociados
      summary: Padrón de la JASS con el saldo de cada asociado (tesorero, consejo)
      responses:
        '200': { description: Asociados, content: { application/json: { schema: { type: object, properties: { asociados: { type: array, items: { $ref: '#/components/schemas/ResumenAsociado' } } } } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
    post:
      tags: [Padrón y pagos]
      operationId: registrarAsociado
      summary: Alta de asociado (tesorero, consejo)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NuevoAsociado' } } } }
      responses:
        '201': { description: Asociado creado, content: { application/json: { schema: { $ref: '#/components/schemas/Asociado' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '409': { $ref: '#/components/responses/E409' }
        '422': { $ref: '#/components/responses/E422' }
  /v1/asociados/{id}/baja:
    post:
      tags: [Padrón y pagos]
      operationId: darDeBajaAsociado
      summary: Baja lógica (se conservan cuotas y pagos)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: Dado de baja }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
  /v1/asociados/{id}/acceso:
    post:
      tags: [Padrón y pagos]
      operationId: crearAccesoAsociado
      summary: Crea la cuenta de acceso del asociado con su DNI del padrón y una clave temporal generada (tesorero, consejo)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '201': { description: Cuenta creada; la clave temporal solo se muestra aquí, content: { application/json: { schema: { $ref: '#/components/schemas/AccesoEntregado' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '409': { $ref: '#/components/responses/E409' }
        '422': { $ref: '#/components/responses/E422' }
  /v1/asociados/{id}/acceso/restablecer:
    post:
      tags: [Padrón y pagos]
      operationId: restablecerAccesoAsociado
      summary: Restablece la clave del asociado con una clave temporal nueva y cierra sus sesiones (tesorero, consejo)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Clave restablecida; la clave temporal solo se muestra aquí, content: { application/json: { schema: { $ref: '#/components/schemas/AccesoEntregado' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '409': { $ref: '#/components/responses/E409' }
  /v1/asociados/{id}/estado-de-cuenta:
    get:
      tags: [Padrón y pagos]
      operationId: consultarEstadoDeCuenta
      summary: Estado de cuenta de un asociado de la JASS
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Estado de cuenta, content: { application/json: { schema: { $ref: '#/components/schemas/EstadoDeCuenta' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }

  /v1/equipo:
    get:
      tags: [Equipo de la JASS]
      operationId: listarEquipo
      summary: Tesorería y Operador de la JASS, con el DNI enmascarado (solo consejo)
      responses:
        '200': { description: Equipo, content: { application/json: { schema: { type: object, properties: { equipo: { type: array, items: { $ref: '#/components/schemas/FilaEquipo' } } } } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
    post:
      tags: [Equipo de la JASS]
      operationId: crearMiembroEquipo
      summary: Alta de Tesorería u Operador con clave temporal generada y cambio pendiente (solo consejo)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NuevoMiembro' } } } }
      responses:
        '201': { description: Cuenta creada; la clave temporal solo se muestra aquí, content: { application/json: { schema: { $ref: '#/components/schemas/AccesoEntregado' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '409': { $ref: '#/components/responses/E409' }
        '422': { $ref: '#/components/responses/E422' }
  /v1/equipo/{usuarioId}/desactivar:
    post:
      tags: [Equipo de la JASS]
      operationId: desactivarMiembroEquipo
      summary: Desactiva la cuenta y cierra sus sesiones (solo consejo; no a sí mismo ni a un consejo)
      parameters: [{ $ref: '#/components/parameters/UsuarioId' }]
      responses:
        '204': { description: Cuenta desactivada }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '409': { $ref: '#/components/responses/E409' }
  /v1/equipo/{usuarioId}/restablecer-clave:
    post:
      tags: [Equipo de la JASS]
      operationId: restablecerClaveEquipo
      summary: Restablece la clave de Tesorería u Operador con una clave temporal y cambio pendiente (solo consejo)
      parameters: [{ $ref: '#/components/parameters/UsuarioId' }]
      responses:
        '200': { description: Clave restablecida; la clave temporal solo se muestra aquí, content: { application/json: { schema: { $ref: '#/components/schemas/AccesoEntregado' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '409': { $ref: '#/components/responses/E409' }

  /v1/plataforma/jass:
    get:
      tags: [Plataforma]
      operationId: listarJass
      summary: JASS con su estado y cantidad de cuentas activas, sin datos de negocio (solo plataforma)
      responses:
        '200': { description: JASS, content: { application/json: { schema: { type: object, properties: { jass: { type: array, items: { $ref: '#/components/schemas/VistaJass' } } } } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
    post:
      tags: [Plataforma]
      operationId: crearJass
      summary: Alta de una JASS con su primer Consejo y clave temporal con cambio pendiente (solo plataforma)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NuevaJass' } } } }
      responses:
        '201': { description: JASS creada; la clave temporal solo se muestra aquí, content: { application/json: { schema: { $ref: '#/components/schemas/JassCreada' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '409': { $ref: '#/components/responses/E409' }
        '422': { $ref: '#/components/responses/E422' }
  /v1/plataforma/jass/{id}/suspender:
    post:
      tags: [Plataforma]
      operationId: suspenderJass
      summary: Suspende la JASS; sus cuentas no inician ni renuevan sesión y sus datos se conservan (solo plataforma)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: JASS suspendida }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '422': { $ref: '#/components/responses/E422' }
  /v1/plataforma/jass/{id}/reactivar:
    post:
      tags: [Plataforma]
      operationId: reactivarJass
      summary: Reactiva una JASS suspendida (solo plataforma)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '204': { description: JASS reactivada }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '422': { $ref: '#/components/responses/E422' }
  /v1/plataforma/jass/{id}/consejo/restablecer-clave:
    post:
      tags: [Plataforma]
      operationId: restablecerClaveConsejo
      summary: Restablece la clave de un Consejo activo de la JASS con una clave temporal y cambio pendiente (solo plataforma)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { usuarioId: { type: string, format: uuid } } } } } }
      responses:
        '200': { description: Clave restablecida; la clave temporal solo se muestra aquí, content: { application/json: { schema: { $ref: '#/components/schemas/ConsejoRestablecido' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '409': { $ref: '#/components/responses/E409' }
        '422': { $ref: '#/components/responses/E422' }

  /v1/cuotas/generar:
    post:
      tags: [Padrón y pagos]
      operationId: generarCuotas
      summary: Genera una cuota por asociado activo para un periodo (idempotente)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GenerarCuotas' } } } }
      responses:
        '200': { description: Cuotas creadas y ya existentes, content: { application/json: { schema: { type: object, properties: { creadas: { type: integer }, existentes: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '422': { $ref: '#/components/responses/E422' }

  /v1/pagos:
    post:
      tags: [Padrón y pagos]
      operationId: registrarPago
      summary: Registra un pago en línea (tesorero, consejo)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NuevoPago' } } } }
      responses:
        '200': { description: Reintento con la misma clave y el mismo contenido; devuelve el pago original, content: { application/json: { schema: { $ref: '#/components/schemas/Pago' } } } }
        '201': { description: Pago registrado, content: { application/json: { schema: { $ref: '#/components/schemas/Pago' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '409': { $ref: '#/components/responses/E409' }
        '422': { $ref: '#/components/responses/E422' }
  /v1/pagos/{id}:
    get:
      tags: [Padrón y pagos]
      operationId: consultarPago
      summary: Detalle de un pago con su reversa, si la hay
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Pago, content: { application/json: { schema: { $ref: '#/components/schemas/PagoConReversa' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
  /v1/pagos/{id}/reversa:
    post:
      tags: [Padrón y pagos]
      operationId: reversarPago
      summary: Reversa compensatoria con motivo; el pago no se borra
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [motivo], properties: { motivo: { type: string, maxLength: 300 } } } } } }
      responses:
        '200': { description: Pago revertido, content: { application/json: { schema: { type: object, properties: { pagoId: { type: string, format: uuid } } } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '409': { $ref: '#/components/responses/E409' }
        '422': { $ref: '#/components/responses/E422' }

  /v1/portal/saldo:
    get:
      tags: [Portal del asociado]
      operationId: portalSaldo
      summary: Saldo del propio asociado (sin identificadores en la ruta)
      responses:
        '200': { description: Saldo, content: { application/json: { schema: { $ref: '#/components/schemas/SaldoPortal' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
  /v1/portal/cuotas:
    get:
      tags: [Portal del asociado]
      operationId: portalCuotas
      summary: Cuotas del propio asociado
      responses:
        '200': { description: Cuotas, content: { application/json: { schema: { type: object, properties: { cuotas: { type: array, items: { $ref: '#/components/schemas/VistaCuota' } } } } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
  /v1/portal/pagos:
    get:
      tags: [Portal del asociado]
      operationId: portalPagos
      summary: Pagos del propio asociado
      responses:
        '200': { description: Pagos, content: { application/json: { schema: { type: object, properties: { pagos: { type: array, items: { $ref: '#/components/schemas/VistaPago' } } } } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }

  /v1/reservorios:
    get:
      tags: [Reservorios y mediciones]
      operationId: listarReservorios
      summary: Reservorios de la JASS (todo el personal)
      responses:
        '200': { description: Reservorios, content: { application/json: { schema: { type: object, properties: { reservorios: { type: array, items: { $ref: '#/components/schemas/Reservorio' } } } } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
    post:
      tags: [Reservorios y mediciones]
      operationId: crearReservorio
      summary: Alta de reservorio (consejo)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nombre], properties: { nombre: { type: string, maxLength: 80 } } } } } }
      responses:
        '201': { description: Reservorio creado, content: { application/json: { schema: { $ref: '#/components/schemas/Reservorio' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '409': { $ref: '#/components/responses/E409' }
        '422': { $ref: '#/components/responses/E422' }
  /v1/reservorios/{id}/mediciones:
    get:
      tags: [Reservorios y mediciones]
      operationId: historialMediciones
      summary: Historial del reservorio, de la toma más reciente a la más antigua (máximo 200)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: Mediciones, content: { application/json: { schema: { type: object, properties: { mediciones: { type: array, items: { $ref: '#/components/schemas/Medicion' } } } } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
  /v1/mediciones/catalogo:
    get:
      tags: [Reservorios y mediciones]
      operationId: catalogoMetodos
      summary: Métodos de medición (catálogo provisional) y unidad
      description: >-
        Dato de referencia igual para todos. Es el único `GET` de `/v1` con caché
        (`Cache-Control: private, max-age=300`, `ETag` y `304`; ADR-016); el resto responde `no-store`.
      responses:
        '200': { description: Catálogo, content: { application/json: { schema: { $ref: '#/components/schemas/Catalogo' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
  /v1/mediciones:
    post:
      tags: [Reservorios y mediciones]
      operationId: registrarMedicion
      summary: Registra una medición manual (operador); la lectura no se estima ni se dictamina
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NuevaMedicion' } } } }
      responses:
        '200': { description: Reintento de una operación ya aceptada, content: { application/json: { schema: { $ref: '#/components/schemas/MedicionRegistrada' } } } }
        '201': { description: Medición registrada, content: { application/json: { schema: { $ref: '#/components/schemas/MedicionRegistrada' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '409': { $ref: '#/components/responses/E409' }
        '422': { $ref: '#/components/responses/E422' }

  /v1/asistente/documentos:
    get:
      tags: [Asistente]
      operationId: documentosAsistente
      summary: Documentos del corpus del asistente y su estado
      responses:
        '200': { description: Documentos, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentosAsistente' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
  /v1/asistente/consultas:
    post:
      tags: [Asistente]
      operationId: consultarAsistente
      summary: Consulta documental con citas, abstención o fuera de alcance (no calcula dosis)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [pregunta], properties: { pregunta: { type: string, minLength: 1, maxLength: 500 } } } } } }
      responses:
        '200': { description: Respuesta del asistente, content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaAsistente' } } } }
        '401': { $ref: '#/components/responses/E401' }
        '403': { $ref: '#/components/responses/E403' }
        '422': { $ref: '#/components/responses/E422' }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT, description: Token de acceso de 15 minutos }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    UsuarioId: { name: usuarioId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid }, description: Clave de idempotencia única por JASS }
  responses:
    E400: { description: Solicitud mal formada (por ejemplo, JSON inválido), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    E401: { description: Sin sesión, token inválido o vencido, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    E403: { description: 'Sin permiso, recurso inexistente o de otra JASS (indistinguibles), JASS suspendida (`jass-suspendida`) o cambio de clave pendiente (`cambio-de-clave-pendiente`)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    E409: { description: Conflicto con el estado actual (duplicado, clave reutilizada, ya revertido), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    E422: { description: Dato inválido, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    E429: { description: Cuenta bloqueada tras 5 intentos fallidos u origen con 50 intentos fallidos en 15 minutos, headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error:
      type: object
      required: [codigo, mensaje]
      properties: { codigo: { type: string }, mensaje: { type: string } }
    Salud:
      type: object
      required: [estado, base]
      properties: { estado: { enum: [ok, degradado] }, base: { enum: [ok, error] } }
    Credenciales:
      type: object
      required: [documento, contrasena]
      properties:
        documento: { type: string, pattern: '^[0-9]{8}$', description: DNI de 8 dígitos }
        contrasena: { type: string }
        tipo: { enum: [asociado, administrador], description: 'Guía opcional: `administrador` vale para personal de una JASS y para la plataforma. El servidor decide el perfil por la membresía.' }
    ErrorTipoDeAcceso:
      type: object
      required: [codigo, mensaje, tipoReal]
      properties: { codigo: { const: tipo-de-acceso-distinto }, mensaje: { type: string }, tipoReal: { enum: [asociado, administrador] } }
    CambioDeClave:
      type: object
      required: [contrasenaActual, contrasenaNueva]
      properties:
        contrasenaActual: { type: string }
        contrasenaNueva: { type: string, minLength: 10, maxLength: 128, description: Distinta del DNI }
    AccesoEntregado:
      type: object
      required: [usuarioId, claveTemporal]
      properties:
        usuarioId: { type: string, format: uuid }
        claveTemporal: { type: string, example: rio-luna-maiz, description: Tres palabras sin tildes; solo se devuelve en esta respuesta y nunca se vuelve a poder consultar }
    FilaEquipo:
      type: object
      properties:
        usuarioId: { type: string, format: uuid }
        nombre: { type: string }
        documento: { type: string, example: '•••••123', description: DNI enmascarado (3 últimos dígitos) }
        rol: { enum: [consejo, tesorero, operador] }
        estado: { enum: [activo, inactivo] }
    NuevoMiembro:
      type: object
      required: [nombre, documento, rol]
      properties: { nombre: { type: string, maxLength: 120 }, documento: { type: string, pattern: '^[0-9]{8}$' }, rol: { enum: [tesorero, operador] } }
    NuevaJass:
      type: object
      required: [nombre, consejo]
      properties:
        nombre: { type: string, maxLength: 120 }
        ubicacion: { $ref: '#/components/schemas/Ubicacion' }
        consejo: { type: object, required: [nombre, documento], properties: { nombre: { type: string, maxLength: 120 }, documento: { type: string, pattern: '^[0-9]{8}$' } } }
    Ubicacion:
      type: object
      properties:
        departamento: { type: [string, 'null'], maxLength: 80 }
        provincia: { type: [string, 'null'], maxLength: 80 }
        distrito: { type: [string, 'null'], maxLength: 80 }
        centroPoblado: { type: [string, 'null'], maxLength: 80 }
    JassCreada:
      type: object
      required: [jassId, usuarioId, claveTemporal]
      properties: { jassId: { type: string, format: uuid }, usuarioId: { type: string, format: uuid }, claveTemporal: { type: string } }
    VistaJass:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        estado: { enum: [activa, suspendida] }
        ubicacion: { $ref: '#/components/schemas/Ubicacion' }
        cuentasActivas: { type: integer }
    ConsejoRestablecido:
      type: object
      properties: { usuarioId: { type: string, format: uuid }, nombre: { type: string }, documento: { type: string }, claveTemporal: { type: string } }
    Refresco:
      type: object
      required: [tokenRefresco]
      properties: { tokenRefresco: { type: string } }
    Sesion:
      type: object
      required: [tokenAcceso, tokenRefresco, venceEnSegundos, perfil, rol, debeCambiarContrasena]
      properties:
        tokenAcceso: { type: string }
        tokenRefresco: { type: string }
        venceEnSegundos: { type: integer, example: 900 }
        perfil: { enum: [personal, asociado, plataforma] }
        rol: { enum: [consejo, tesorero, operador, null] }
        debeCambiarContrasena: { type: boolean }
    Perfil:
      type: object
      properties:
        perfil: { enum: [personal, asociado, plataforma] }
        rol: { enum: [consejo, tesorero, operador, null] }
        nombre: { type: string }
        documento: { type: [string, 'null'], example: '•••••123', description: DNI enmascarado }
        jass: { type: [object, 'null'], properties: { nombre: { type: string } }, description: Nulo en la plataforma }
        debeCambiarContrasena: { type: boolean }
    NuevoAsociado:
      type: object
      required: [nombre, documento]
      properties: { nombre: { type: string, maxLength: 120 }, documento: { type: string, pattern: '^[A-Za-z0-9-]{4,20}$' } }
    Asociado:
      type: object
      properties: { id: { type: string, format: uuid }, jassId: { type: string, format: uuid }, nombre: { type: string }, documento: { type: string }, estado: { enum: [activo, baja] } }
    ResumenAsociado:
      type: object
      properties: { id: { type: string, format: uuid }, nombre: { type: string }, documento: { type: string }, estado: { enum: [activo, baja] }, saldoCentimos: { type: integer }, acceso: { enum: [sin-acceso, activo, inactivo] } }
    GenerarCuotas:
      type: object
      required: [periodo, importeCentimos]
      properties: { periodo: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }, importeCentimos: { type: integer, minimum: 1, maximum: 1000000000 } }
    NuevoPago:
      type: object
      required: [cuotaId, importeCentimos, comprobante]
      properties: { cuotaId: { type: string, format: uuid }, importeCentimos: { type: integer, minimum: 1, maximum: 1000000000 }, comprobante: { type: string, maxLength: 60 } }
    Pago:
      type: object
      properties:
        id: { type: string, format: uuid }
        cuotaId: { type: string, format: uuid }
        importeCentimos: { type: integer }
        pagadoEn: { type: string, format: date-time }
        comprobante: { type: string }
        estado: { enum: [vigente, revertido] }
    PagoConReversa:
      allOf:
        - { $ref: '#/components/schemas/Pago' }
        - type: object
          properties: { reversa: { type: [object, 'null'], properties: { motivo: { type: string }, creadaEn: { type: string, format: date-time } } } }
    VistaCuota:
      type: object
      properties:
        id: { type: string, format: uuid }
        periodo: { type: string }
        importeCentimos: { type: integer }
        pagadoCentimos: { type: integer }
        pendienteCentimos: { type: integer }
        estado: { enum: [pendiente, parcial, pagada] }
    VistaPago:
      type: object
      properties:
        id: { type: string, format: uuid }
        cuotaId: { type: string, format: uuid }
        periodo: { type: string }
        importeCentimos: { type: integer }
        pagadoEn: { type: string, format: date-time }
        comprobante: { type: string }
        estado: { enum: [vigente, revertido] }
    EstadoDeCuenta:
      type: object
      properties:
        asociado: { type: object }
        acceso: { enum: [sin-acceso, activo, inactivo], description: Solo en la consulta del personal }
        saldoCentimos: { type: integer, description: Positivo cuando el asociado debe }
        periodoActual: { type: string }
        cuotas: { type: array, items: { $ref: '#/components/schemas/VistaCuota' } }
        pagos: { type: array, items: { $ref: '#/components/schemas/VistaPago' } }
    SaldoPortal:
      type: object
      properties: { asociado: { type: object, properties: { nombre: { type: string }, estado: { enum: [activo, baja] } } }, saldoCentimos: { type: integer }, periodoActual: { type: string } }
    Reservorio:
      type: object
      properties: { id: { type: string, format: uuid }, jassId: { type: string, format: uuid }, nombre: { type: string } }
    Catalogo:
      type: object
      properties: { metodos: { type: array, items: { type: object, properties: { codigo: { type: string }, descripcion: { type: string } } } }, unidad: { const: mg/L } }
    NuevaMedicion:
      type: object
      description: No admite jassId, registradoPor, registradaEn, estado ni revision (`campo-no-permitido`).
      required: [reservorioId, metodo, valor, unidad, tomadaEn]
      properties:
        reservorioId: { type: string, format: uuid }
        metodo: { enum: [comparador-dpd, colorimetro] }
        valor: { type: number, minimum: 0 }
        unidad: { const: mg/L }
        tomadaEn: { type: string, format: date-time, description: ISO 8601 con zona horaria }
    MedicionRegistrada:
      type: object
      properties: { medicionId: { type: string, format: uuid }, revision: { type: integer }, registradaEn: { type: string, format: date-time } }
    Medicion:
      type: object
      properties:
        id: { type: string, format: uuid }
        reservorioId: { type: string, format: uuid }
        metodo: { type: string }
        valor: { type: number }
        unidad: { type: string }
        tomadaEn: { type: string, format: date-time }
        registradaEn: { type: string, format: date-time }
        registradoPor: { type: string, format: uuid }
        estado: { enum: [vigente, anulada] }
        revision: { type: integer }
    DocumentosAsistente:
      type: object
      properties:
        corpus: { enum: [ejemplo, aprobado] }
        nombre: { type: string }
        documentos: { type: array, items: { type: object, properties: { id: { type: string }, titulo: { type: string }, version: { type: string }, estado: { enum: [ejemplo, aprobado] }, paginas: { type: integer } } } }
    RespuestaAsistente:
      type: object
      required: [estado, corpus, mensaje, citas]
      properties:
        estado: { enum: [respondida, sin-evidencia, fuera-de-alcance] }
        corpus: { enum: [ejemplo, aprobado] }
        mensaje: { type: string }
        respuesta: { type: string, description: Solo en `respondida`; concatenación de los fragmentos citados }
        citas:
          type: array
          maxItems: 3
          items:
            type: object
            properties: { documentoId: { type: string }, documento: { type: string }, version: { type: string }, pagina: { type: integer }, fragmento: { type: string } }
